<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0f1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(40, 116, 240, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(40, 116, 240, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 45px 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(40, 116, 240, 0.2);
        }

        .lock-icon {
            text-align: center;
            margin-bottom: 25px;
        }

        .lock-icon i {
            font-size: 48px;
            color: #2874f0;
            filter: drop-shadow(0 0 15px rgba(40, 116, 240, 0.5));
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            margin-bottom: 35px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .flash-msg {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff6b6b;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #2874f0;
            background: rgba(40, 116, 240, 0.08);
            box-shadow: 0 0 0 3px rgba(40, 116, 240, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn-secure {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2874f0, #1a5cd4);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: 0.3s;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(40, 116, 240, 0.4);
        }

        .btn-secure:hover {
            background: linear-gradient(135deg, #1a5cd4, #1048a8);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(40, 116, 240, 0.5);
        }

        .security-note {
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="lock-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>Secure Access</h1>
        <p class="subtitle">Authorized Personnel Only</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-msg">
            <i class="bi bi-exclamation-triangle"></i> {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="/admin-secure-access-xk9" autocomplete="off">
            <div class="form-group">
                <label>Admin ID</label>
                <div class="input-wrap">
                    <i class="bi bi-person-fill"></i>
                    <input type="text" name="email" placeholder="Enter admin ID" required autocomplete="off">
                </div>
            </div>
            <div class="form-group">
                <label>Passphrase</label>
                <div class="input-wrap">
                    <i class="bi bi-key-fill"></i>
                    <input type="password" name="password" placeholder="Enter passphrase" required>
                </div>
            </div>
            <button type="submit" class="btn-secure">
                <i class="bi bi-arrow-right-circle"></i> Authenticate
            </button>
        </form>

        <div class="security-note">
            <i class="bi bi-lock-fill"></i>
            Access is monitored and logged
        </div>
    </div>
</body>

</html>
