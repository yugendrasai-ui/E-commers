{% extends 'base.html' %}

{% block title %}Update Product - Seller Central{% endblock %}

{% block content %}
<div class="admin-form-container">
  <div class="admin-form-card">
    <div class="af-header">
      <h2>Update Product</h2>
      <p>Editing: <strong>{{ product.name }}</strong></p>
    </div>

    <form method="POST" action="/merchant/update-item/{{ product.product_id }}" enctype="multipart/form-data"
      class="af-body">

      <div class="form-group">
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name }}" required>
      </div>

      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" value="{{ product.category }}" required>
      </div>

      <div class="form-group">
        <label>Price (₹)</label>
        <input type="number" step="0.01" name="price" value="{{ product.price }}" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="5" required>{{ product.description }}</textarea>
      </div>

      <div class="form-group">
        <label>Current Image</label>
        <div class="current-image-preview">
          <img src="/static/uploads/product_images/{{ product.image }}" id="currentImg"
            style="max-height: 150px; border-radius: 4px; display: block; margin-bottom: 10px;">
        </div>
        <label>Replace Image (Optional)</label>
        <div class="file-input-wrapper small">
          <input type="file" name="image" id="productImage" accept="image/*" onchange="previewImage(event)">
          <div class="image-preview" id="imagePreview">
            <i class="bi bi-cloud-arrow-up"></i>
            <span>Click to choose a different image</span>
          </div>
        </div>
      </div>

      <div class="af-footer">
        <a href="/merchant/item-list" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-submit">Update Details</button>
      </div>

    </form>
  </div>
</div>

<style>
  .admin-form-container {
    display: flex;
    justify-content: center;
    padding: 50px 0;
  }

  .admin-form-card {
    background: #fff;
    width: 100%;
    max-width: 600px;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }

  body.dark .admin-form-card {
    background: #111;
    box-shadow: 0 2px 12px rgba(255, 255, 255, 0.05);
  }

  .af-header {
    padding: 25px 35px;
    border-bottom: 1px solid #f0f0f0;
    background: #f9f9f9;
  }

  body.dark .af-header {
    border-color: #333;
    background: #1a1a1a;
  }

  .af-header h2 {
    margin: 0;
    font-size: 20px;
  }

  .af-header p {
    color: #878787;
    margin: 5px 0 0 0;
    font-size: 14px;
  }

  .af-body {
    padding: 30px 35px;
  }

  .form-group {
    margin-bottom: 25px;
  }

  .form-group label {
    display: block;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 8px;
    text-transform: uppercase;
    color: #878787;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    font-size: 15px;
    outline: none;
    box-sizing: border-box;
  }

  body.dark .form-group input,
  body.dark .form-group textarea {
    background: #222;
    border-color: #333;
    color: #fff;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #2874f0;
  }

  .file-input-wrapper {
    position: relative;
    border: 2px dashed #e0e0e0;
    border-radius: 4px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
  }

  body.dark .file-input-wrapper {
    border-color: #333;
  }

  .file-input-wrapper input {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  .image-preview i {
    font-size: 30px;
    color: #2874f0;
    display: block;
    margin-bottom: 5px;
  }

  .image-preview span {
    color: #878787;
    font-size: 13px;
  }

  .af-footer {
    display: flex;
    justify-content: flex-end;
    gap: 15px;
    padding-top: 10px;
  }

  .btn-submit {
    background: #fb641b;
    color: white;
    border: none;
    padding: 12px 30px;
    font-weight: 600;
    border-radius: 2px;
    cursor: pointer;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, .2);
  }

  .btn-cancel {
    color: #212121;
    text-decoration: none;
    padding: 12px 20px;
    font-weight: 600;
    font-size: 14px;
  }

  body.dark .btn-cancel {
    color: #ccc;
  }
</style>

<script>
  function previewImage(event) {
    const reader = new FileReader();
    const preview = document.getElementById('imagePreview');
    const currentImg = document.getElementById('currentImg');

    reader.onload = function () {
      preview.innerHTML = `<img src="${reader.result}" style="max-height: 150px; max-width: 100%; border-radius: 4px;">`;
      if (currentImg) currentImg.style.opacity = '0.3';
    }

    if (event.target.files[0]) {
      reader.readAsDataURL(event.target.files[0]);
    }
  }
</script>
{% endblock %}
