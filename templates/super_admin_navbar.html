<!-- Mobile top bar (hamburger + title) -->
<div class="admin-mobile-bar">
    <button id="adminSidebarToggle" class="admin-hamburger" aria-label="Open menu">
        <i class="fas fa-bars"></i>
    </button>
    <div class="admin-mobile-actions" style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
        <a href="/super-admin/dashboard" class="notification-bell mobile-only" title="Notifications">
            <i class="fas fa-bell"></i>
            <span class="notification-badge" id="mobile-notify-badge" style="display: none;">0</span>
        </a>
        <span class="admin-mobile-title">Express-Kart Admin</span>
    </div>
</div>

<div class="sidebar" id="adminSidebar">
    <button id="adminSidebarClose" class="admin-sidebar-close" aria-label="Close menu">&times;</button>
    <a href="/super-admin/dashboard" class="sidebar-brand">
        <i class="fas fa-crown"></i>
        <span>Express-Kart Admin</span>
    </a>
    <div class="nav-heading">Admin Panel</div>
    <a href="/super-admin/dashboard"
        class="nav-item {% if request.path == '/super-admin/dashboard' %}active{% endif %}">
        <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
        <span class="badge badge-notify" id="sidebar-notify-badge" style="display: none;">0</span>
    </a>
    <a href="/super-admin/merchants"
        class="nav-item {% if '/super-admin/merchants' in request.path %}active{% endif %}">
        <i class="fas fa-store"></i><span>Manage Merchants</span>
    </a>
    <a href="/super-admin/users" class="nav-item {% if '/super-admin/users' in request.path %}active{% endif %}">
        <i class="fas fa-users"></i><span>Manage Users</span>
    </a>
    <div class="nav-heading">Products</div>
    <a href="/super-admin/products" class="nav-item {% if request.path == '/super-admin/products' %}active{% endif %}">
        <i class="fas fa-boxes"></i><span>All Products</span>
    </a>
    <div class="nav-heading">Account</div>
    <a href="/super-admin/logout" class="nav-item">
        <i class="fas fa-sign-out-alt"></i><span>Logout</span>
    </a>
</div>
<div id="adminSidebarOverlay" class="admin-sidebar-overlay"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggle = document.getElementById('adminSidebarToggle');
        const sidebar = document.getElementById('adminSidebar');
        const closeBtn = document.getElementById('adminSidebarClose');
        const overlay = document.getElementById('adminSidebarOverlay');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        if (toggle) toggle.addEventListener('click', openSidebar);
        if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
        if (overlay) overlay.addEventListener('click', closeSidebar);
    });
</script>
